<div class="activity" data-commits="{{ include.commits }}"><div class="bars" aria-hidden="true">{% for count in include.months %}<span class="level-{% if count == 0 %}0{% elsif count < 3 %}1{% elsif count < 6 %}2{% elsif count < 12 %}3{% else %}4{% endif %}"></span>{% endfor %}</div><p class="commits">{{ include.commits }} {% if include.commits == 1 %}commit{% else %}commits{% endif %} in the last 12 months</p></div>
