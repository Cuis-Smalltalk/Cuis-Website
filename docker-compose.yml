services:
  jekyll:
    image: ruby:4.0.7
    working_dir: /site
    volumes:
      - .:/site
      - bundle:/usr/local/bundle
    ports:
      - '4000:4000'
      - '35729:35729'
    command: [ "sh", "-c", "bundle install && bundle exec jekyll serve --force_polling -H 0.0.0.0 -P 4000 --livereload --livereload-port 35729" ]

volumes:
  bundle:
